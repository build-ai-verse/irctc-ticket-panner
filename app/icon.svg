<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="IRCTC Ticket Planner">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffa940"/>
      <stop offset="0.55" stop-color="#f2760b"/>
      <stop offset="1" stop-color="#dd5410"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#tile)"/>

  <!-- Train, front on: the nose that arrives in the hero scene. Shapes are kept
       heavy and few so the mark still reads as a train at 16px. -->
  <g fill="#fff">
    <path d="M22 11h20a9 9 0 0 1 9 9v23a6 6 0 0 1-6 6H19a6 6 0 0 1-6-6V20a9 9 0 0 1 9-9Z" opacity=".97"/>
  </g>
  <!-- Window band -->
  <path d="M19.5 21.5h25a1 1 0 0 1 1 1V31a1 1 0 0 1-1 1h-25a1 1 0 0 1-1-1v-8.5a1 1 0 0 1 1-1Z" fill="#c14a09"/>
  <!-- Headlights -->
  <circle cx="24" cy="40" r="3.4" fill="#c14a09"/>
  <circle cx="40" cy="40" r="3.4" fill="#c14a09"/>
  <!-- Track, splaying toward the viewer -->
  <path d="M20.5 53.5 15 60M43.5 53.5 49 60" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9"/>
</svg>
